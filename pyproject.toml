[project]
name = "poukazky"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-cleanup>=9.0.0",
    "django-debug-toolbar>=8.0.0",
    "django-htmx>=1.29.0",
    "django-probes>=1.9.0",
    "django-tables2>=3.0.1",
    "django-types>=0.24.0",
    "django-widget-tweaks>=1.5.1",
    "environs[django]>=15.2.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk>=2.72.0",
    "mozilla-django-oidc>=5.0.2",
    "pillow>=12.3.0",
    "coupon-codes>=0.1",
    "django-turnstile>=0.1.3",
    "typst>=0.15.0",
    "django-admin-action-forms>=3.0.0",
    "django-no-queryset-admin-actions>=1.2.1",
    "django-rq>=4.2.0",
    "mjml-python>=1.4.2",
]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9",  # pycodestyle errors (default from ruff)
  "F",  # pyflakes
  "I",  # isort
  "N",  # naming conventions
  "DJ", # Django
  "T20", # print()
  "Q",  # quotes
  "A",  # overwritting builtins
  "LOG", # logging
  "PTH", # use pathlib
]

[tool.bumpver]
current_version = "2026.9"
version_pattern = "YYYY.INC1"
commit_message = "bump version -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"poukazky/__init__.py" = [
    'VERSION = "{version}"',
]
