{% extends "emails/base_email.html" %}

{% block content %}
<mj-text padding-bottom="0px" line-height="1.3">
  <p>Ahoj,</p>

  <p>Nasledujúce poukážky poskytovatelov expirujú čoskoro:</p>

  <ul>

  </ul>
</mj-text>
{% endblock content %}
